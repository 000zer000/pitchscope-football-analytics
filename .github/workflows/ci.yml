name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_data:
        description: 'Download the pinned real tournament for the browser demo (provider network required)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: pitchscope
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pitchscope_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://pitchscope:test-only@localhost:5432/pitchscope_test
      TEST_DATABASE_URL: postgresql+psycopg://pitchscope:test-only@localhost:5432/pitchscope_test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned uv without post-job cache hooks
        run: |
          python3 -m venv /tmp/pitchscope-uv
          /tmp/pitchscope-uv/bin/pip install uv==0.12.10
          echo /tmp/pitchscope-uv/bin >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check backend scripts/*.py && uv run ruff format --check backend scripts/*.py
      # This dedicated database contains only original synthetic fixtures. No provider network.
      - run: env -u DATABASE_URL uv run pytest -q --require-postgres
      # pytest recreates only the disposable test schema; bootstrap migration history afresh.
      - name: Bootstrap browser dataset
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          if [ "${{ inputs.real_data }}" = "true" ]; then
            uv run python -m app.ingest download
            uv run python -m app.ingest import
            uv run python -m app.ingest import
            uv run python scripts/audit-real.py
            uv run python scripts/case-study.py --check docs/case-study.json
          else
            uv run python scripts/seed-test.py
          fi
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          set -euo pipefail
          .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev > /tmp/web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/api/ready && break; sleep 1; done
          cd frontend
          RECORD_VIDEO=${{ inputs.real_data }} npm run e2e
      - name: Package captioned real demonstration
        if: inputs.real_data == true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          video=$(find frontend/test-results -name video.webm -print -quit)
          test -n "$video"
          ffmpeg -y -i "$video" -vf "subtitles=frontend/test-results/pitchscope-demo.vtt:force_style='FontSize=16,Outline=2,MarginV=20'" -c:v libx264 -crf 23 -pix_fmt yuv420p -movflags +faststart frontend/test-results/pitchscope-demo.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 frontend/test-results/pitchscope-demo.mp4 > frontend/test-results/video-duration.txt
          python -c 'from pathlib import Path; duration=float(Path("frontend/test-results/video-duration.txt").read_text()); assert 88 <= duration <= 115, duration'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: frontend/test-results
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clean build and migrations
        run: docker compose -p pitchscope-ci -f compose.yaml -f compose.ci.yaml up --build -d --wait
      - name: Import twice and verify persistence across restart
        run: |
          set -euo pipefail
          dc() { docker compose -p pitchscope-ci -f compose.yaml -f compose.ci.yaml "$@"; }
          dc exec -T api python scripts/seed-test.py
          dc exec -T api python scripts/seed-test.py
          curl --fail http://127.0.0.1:8080/api/coverage > /tmp/before.json
          python -c 'import json; c=json.load(open("/tmp/before.json")); assert c["events"]==9 and c["imported_matches"]==1'
          dc restart db api web
          dc up -d --wait
          curl --fail http://127.0.0.1:8080/api/coverage > /tmp/after.json
          python -c 'import json; a=json.load(open("/tmp/before.json")); b=json.load(open("/tmp/after.json")); assert (a["events"],a["players"],a["imports"])==(b["events"],b["players"],b["imports"])'
          curl --fail 'http://127.0.0.1:8080/api/report.pdf?left=1&right=2&role=Forward&min_minutes=0' -o /tmp/report.pdf
          python -c 'from pathlib import Path; p=Path("/tmp/report.pdf"); assert p.stat().st_size>5000 and p.read_bytes().startswith(b"%PDF")'
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose -p pitchscope-ci -f compose.yaml -f compose.ci.yaml logs --no-color
          docker compose -p pitchscope-ci -f compose.yaml -f compose.ci.yaml down -v
